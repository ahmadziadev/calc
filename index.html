<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div class="case">
        <div class="screen-bezel">
            <div class="screen">1234.98</div>
            <div class="background-screen">.8.8.8.8.8.8.8.8.8.8.8.8.</div>
        </div>
        <div class="keypad">
            <div class="row">
                <button id="c" class="controls">C</button>
                <button id="ce" class="controls">CE</button>
                <button id="percent" class="function">%</button>
                <button id="divide" class="operator">÷</button>
            </div>
            <div class="row">
                <button id="seven" class="number">7</button>
                <button id="eight" class="number">8</button>
                <button id="nine" class="number">9</button>
                <button id="product" class="operator">×</button>
            </div>
            <div class="row">
                <button id="four" class="number">4</button>
                <button id="five" class="number">5</button>
                <button id="six" class="number">6</button>
                <button id="minus" class="operator">−</button>
            </div>
            <div class="row">
                <button id="one" class="number">1</button>
                <button id="two" class="number">2</button>
                <button id="three" class="number">3</button>
                <button class="operator" id="+">+</button>
            </div>
            <div class="row">
                <button id="zero" class="number">0</button>
                <button id="decimal" class="number">.</button>
                <button id="equals" class="controls">=</button>
            </div>

        </div>
    </div>
</body>
</html>
